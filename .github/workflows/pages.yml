name: Deploy German Quiz to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: german-quiz-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require a content-free checkout
        run: |
          for path in data source-pdfs reports; do
            test ! -e "$path"
          done
          if git ls-files | grep -Ei '\.pdf$|personal-vocabulary.*\.json$'; then
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the static build
        uses: actions/deploy-pages@v4
        id: deployment
